# .agentbox/local.yml
#
# Project-specific overrides for agentbox.
# This file is NEVER overwritten by agentbox - your changes are safe.
#
# Add your customizations here:
#
#   services:
#     agentbox:
#       volumes:
#         - ./data:/home/box/data      # mount project directory
#         - ~/.ssh:/home/box/.ssh:ro   # mount SSH keys (read-only)
#       environment:
#         - MY_API_KEY=secret
#
# For advanced customization (modifying base templates, removing features),
# edit files in ~/.agentbox/skeleton/ and run 'agentbox init' to apply.
