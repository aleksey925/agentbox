# agentbox core configuration
# This file is managed by agentbox and will be overwritten on updates.
services:
  agentbox:
    image: agentbox:local
    build:
      context: .
      dockerfile: .agentbox/Dockerfile.v1.agentbox
    # mirror the host project path (see CLAUDE.md "Live, not baked").
    # agentbox exports AGENTBOX_PROJECT_PATH; ${PWD} is the fallback for manual runs.
    working_dir: ${AGENTBOX_PROJECT_PATH:-${PWD}}
    environment:
      - MISE_TRUSTED_CONFIG_PATHS=${AGENTBOX_PROJECT_PATH:-${PWD}}
    volumes:
      # ai agents binaries (read-only mount from host)
      - ~/.agentbox/bin:/opt/agentbox/bin:ro
      # agent launch flags (read-only; resolved live on each launch, no rebuild)
      - ~/.agentbox/flags:/opt/agentbox/flags:ro
      # mise cache (installed tools and downloads, shared between projects)
      - mise-data:/home/box/.local/share/mise
      - mise-cache:/home/box/.cache/mise
      # agent configs
      - ~/.claude.sandbox.json:/home/box/.claude.json
      - ~/.claude/:/home/box/.claude/
      - ~/.copilot/:/home/box/.copilot/
      - ~/.codex/:/home/box/.codex/
      - ~/.cursor/:/home/box/.cursor/
      - ~/.config/opencode/:/home/box/.config/opencode/
      - ~/.local/share/opencode/:/home/box/.local/share/opencode/
      - ~/.local/state/opencode/:/home/box/.local/state/opencode/
      - opencode-cache:/home/box/.cache/opencode
      - ~/.config/ralphex/:/home/box/.config/ralphex/
      # git config (for commits inside sandbox)
      - ~/.gitconfig:/home/box/.gitconfig:ro
      # project files (mounted at the host path, see working_dir above)
      - .:${AGENTBOX_PROJECT_PATH:-${PWD}}

volumes:
  mise-data:
    name: agentbox-mise-data
    external: true
  mise-cache:
    name: agentbox-mise-cache
    external: true
  opencode-cache:
    name: agentbox-opencode-cache
    external: true
