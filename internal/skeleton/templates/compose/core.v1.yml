# agentbox core configuration
# This file is managed by agentbox and will be overwritten on updates.
services:
  agentbox:
    build:
      context: ..
      dockerfile: .agentbox/Dockerfile.v1.agentbox
    volumes:
      # ai agents binaries (read-only mount from host)
      - ~/.agentbox/bin:/opt/agentbox/bin:ro
      # agent configs
      - ~/.claude.json:/home/box/.claude.json
      - ~/.claude/:/home/box/.claude/
      - ~/.copilot/:/home/box/.copilot/
      - ~/.codex/:/home/box/.codex/
      - ~/.gemini/:/home/box/.gemini/
      # project files
      - ..:/home/box/app
