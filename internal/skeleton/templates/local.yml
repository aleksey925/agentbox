# Project-specific overrides for agentbox.
# This file is NEVER overwritten by agentbox - your changes are safe.

# For advanced customization (modifying base templates, removing features),
# edit files in ~/.agentbox/skeleton/ and run 'agentbox init' to apply.

# Example:
#
# services:
#   agentbox:
#     volumes:
#       - ~/CodeProjects/other-project:/home/box/other-project:ro
#     environment:
#       - MY_API_KEY=secret

# Security: anything you mount here is readable by the agent. ':ro' keeps it
# read-only, so the agent cannot corrupt the data, but it can still read every
# file - and the agent has network access. If a mounted directory holds secrets
# (.env files, API keys, tokens, SSH keys), assume they can leak. Better mount a
# single specific project you need.

services:
  agentbox: {}
